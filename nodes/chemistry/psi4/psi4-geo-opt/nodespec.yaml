# ===========================================================================
# psi4-geo-opt — Psi4 Geometry Optimization
#
# 使用 Psi4 进行几何结构优化（找能量极小点）。
# ===========================================================================

metadata:
  name: psi4-geo-opt
  version: 1.0.0
  display_name: Psi4 Geometry Optimization
  description: >
    Performs a geometry optimization using Psi4 to find the minimum-energy
    molecular structure. Supports various optimization algorithms and
    convergence criteria.
  description_zh: 使用 Psi4 进行几何优化，寻找能量最低的分子结构。支持多种优化算法和收敛判据。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: geometry-optimization
  base_image_ref: psi4-1.10
  tags:
    software: psi4
    version: "1.10"
    method:
      - DFT
      - HF
      - geometry-optimization
    domain:
      - molecular
    capabilities:
      - geometry-optimization
    keywords:
      - psi4
      - optimization
      - geometry

  display_name_zh: Psi4 几何优化
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: >
      Molecular geometry in standard XYZ format (Angstrom).
    description_zh: 标准 XYZ 格式（埃）的分子几何结构。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: optimized_xyz
    display_name: Optimized Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    description: Optimized molecular geometry in XYZ format.
    description_zh: XYZ 格式的优化后分子几何结构。

    display_name_zh: 优化后几何
  - name: total_energy
    display_name: Final Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total electronic energy at the optimized geometry.
    description_zh: 优化后几何结构处的总电子能量。

    display_name_zh: 最终能量
onboard_inputs:
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: method
    display_name: Electronic Structure Method
    kind: string
    default: B3LYP
    description: "Psi4 method keyword, e.g. B3LYP, PBE0, HF, MP2"
    description_zh: Psi4 方法关键字，例如 B3LYP、PBE0、HF、MP2。

    display_name_zh: 方法
  - name: basis_set
    display_name: Basis Set
    kind: string
    default: cc-pVDZ
    description: "Basis set name, e.g. cc-pVDZ, cc-pVTZ, 6-31G*"
    description_zh: 基组名称，例如 cc-pVDZ、cc-pVTZ、6-31G*。

    display_name_zh: 基组
  - name: reference
    display_name: SCF Reference
    kind: enum
    default: rhf
    allowed_values:
      - rhf
      - uhf
      - rohf

    display_name_zh: SCF 参考
    description: 'SCF reference: RHF / UHF / ROHF.'
    description_zh: SCF 参考态：RHF / UHF / ROHF。
  - name: scf_type
    display_name: SCF Algorithm
    kind: enum
    default: pk
    allowed_values:
      - pk
      - direct
      - df

    display_name_zh: SCF 算法
    description: SCF iteration algorithm (e.g. DIIS).
    description_zh: SCF 迭代算法（如 DIIS）。
  - name: max_iter
    display_name: Max Optimization Steps
    kind: integer
    default: 100
    min_value: 10
    max_value: 500

    display_name_zh: 最大优化步数
    description: Maximum geometry optimization iterations.
    description_zh: 几何优化最大迭代步数。
  - name: geom_max_force
    display_name: Force Convergence Threshold
    kind: float
    default: 3.0e-4
    description: "Maximum force convergence criterion (Hartree/Bohr)."
    description_zh: 最大受力收敛标准（Hartree/Bohr）。

    display_name_zh: 力收敛阈值
onboard_outputs:
  - name: final_energy
    display_name: Final Energy (Ha)
    kind: float
    unit: Ha
    description: Energy at the optimized geometry.
    description_zh: 优化后几何结构处的能量。

    display_name_zh: 最终能量 (Ha)
  - name: opt_cycles
    display_name: Optimization Cycles
    kind: integer
    description: Number of geometry optimization steps taken.
    description_zh: 几何优化的步数。

    display_name_zh: 优化循环数
  - name: opt_converged
    display_name: Optimization Converged
    kind: boolean
    description: Whether the geometry optimization converged.
    description_zh: 几何优化是否已收敛。
    quality_gate: true
    gate_default: must_pass
    gate_description: "Geometry optimization must converge."

    display_name_zh: 优化已收敛
    gate_description_zh: 晶胞优化必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 4.0
  mem_overhead: 4.0
  estimated_walltime_hours: 1.0
  scratch_disk_gb: 10.0
  parallel_tasks: 4
  parametrize:
    - cpu_cores
    - parallel_tasks
    - mem_gb
    - estimated_walltime_hours

execution: {}

semantic_identity: >-
  Geometry optimization using Psi4 open-source quantum chemistry software.
  Produces optimized molecular geometry and final energy.

distinguishing_ports:
  - optimized_xyz
  - total_energy

rag_summary: ""
