# ===========================================================================
# psi4-ccsd — Psi4 CCSD Single-Point
#
# 使用 Psi4 进行 CCSD 单点能量计算，支持冻结芯轨道。
# ===========================================================================

metadata:
  name: psi4-ccsd
  version: 1.0.0
  display_name: Psi4 Coupled Cluster (CCSD/CCSD(T))
  description: >
    Performs CCSD or CCSD(T) single-point energy calculation using Psi4.
    CCSD(T) includes perturbative triple excitations for higher accuracy.
    Supports frozen-core approximation.
  description_zh: 使用 Psi4 进行 CCSD 或 CCSD(T) 单点能计算。CCSD(T) 包含微扰三重激发，精度更高。支持冻结芯近似。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: single-point-energy
  base_image_ref: psi4-1.10
  tags:
    software: psi4
    version: "1.10"
    method:
      - CCSD
      - "CCSD(T)"
      - single-point
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - single-point-energy
    keywords:
      - psi4
      - ccsd
      - coupled-cluster
      - open-source

  display_name_zh: Psi4 耦合簇 (CCSD/CCSD(T))
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: Molecular geometry in standard XYZ format (Angstrom).
    description_zh: 标准 XYZ 格式（埃）的分子几何结构。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: total_energy
    display_name: Total Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total CCSD electronic energy.
    description_zh: 总的 CCSD 电子能量。

    display_name_zh: 最终能量
  - name: wavefunction_data
    display_name: Wavefunction Data
    io_type:
      category: software_data_package
      ecosystem: psi4
      data_type: wavefunction
    description: Psi4 wavefunction data (JSON serialized).
    description_zh: Psi4 波函数数据（JSON 序列化）。

    display_name_zh: 波函数数据
onboard_inputs:
  - name: method_variant
    display_name: Coupled Cluster Variant
    kind: enum
    default: CCSD
    allowed_values:
      - CCSD
      - "CCSD(T)"
    description: "CCSD(T) includes perturbative triple excitations — higher accuracy but significantly more expensive."
    description_zh: CCSD(T) 包含微扰三重激发——精度更高但计算成本显著增加。

    display_name_zh: 耦合簇变体
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: basis_set
    default: cc-pVDZ
    _shared_param: basis_sets

  - name: reference
    display_name: SCF Reference
    kind: enum
    default: rhf
    allowed_values:
      - rhf
      - uhf
      - rohf

    display_name_zh: SCF 参考
    description: 'SCF reference: RHF / UHF / ROHF.'
    description_zh: SCF 参考态：RHF / UHF / ROHF。
  - name: scf_type
    display_name: SCF Algorithm
    kind: enum
    default: pk
    allowed_values:
      - pk
      - direct
      - df

    display_name_zh: SCF 算法
    description: SCF iteration algorithm (e.g. DIIS).
    description_zh: SCF 迭代算法（如 DIIS）。
  - name: frozen_core
    display_name: Frozen Core
    kind: boolean
    default: true
    description: Freeze core electrons in CCSD correlation treatment.
    description_zh: 在 CCSD 关联处理中冻结芯电子。

    display_name_zh: 冻结芯
onboard_outputs:
  - name: scf_energy
    display_name: SCF Energy (Ha)
    kind: float
    unit: Ha

    display_name_zh: 最终能量 (Ha)
    description: Total energy after SCF convergence (Hartree).
    description_zh: SCF 收敛后的总能量（Hartree）。
  - name: scf_iterations
    display_name: SCF Iterations
    kind: integer

    display_name_zh: SCF 迭代次数
    description: Number of SCF iterations.
    description_zh: SCF 实际迭代次数。
  - name: scf_converged
    display_name: SCF Converged
    kind: boolean
    quality_gate: true
    gate_default: must_pass
    gate_description: "SCF must converge for the CCSD energy to be meaningful."

    display_name_zh: SCF 已收敛
    description: Whether SCF converged.
    description_zh: SCF 是否已收敛。
    gate_description_zh: SCF 必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 4.0
  mem_overhead: 4.0
  estimated_walltime_hours: 6.0
  scratch_disk_gb: 10.0
  parallel_tasks: 4
  parametrize:
    - cpu_cores
    - parallel_tasks
    - mem_gb
    - estimated_walltime_hours

execution: {}

semantic_identity: >-
  Coupled-cluster (CCSD or CCSD(T)) single-point energy calculation using Psi4.

distinguishing_ports:
  - total_energy

rag_summary: ""
