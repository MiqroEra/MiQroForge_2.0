# ===========================================================================
# psi4-single-point — Psi4 Single-Point Energy Calculation
#
# 使用 Psi4 进行单点能量计算（HF, DFT, MP2, CCSD 等）。
# Psi4 是开源量子化学程序，无 license 限制。
# ===========================================================================

metadata:
  name: psi4-single-point
  version: 1.0.0
  display_name: Psi4 Single-Point Energy
  description: >
    Performs a single-point electronic energy calculation using Psi4.
    Supports HF, DFT, MP2, and CCSD methods. Open-source alternative
    to ORCA/Gaussian for molecular quantum chemistry.
  description_zh: 使用 Psi4 进行单点电子能量计算。支持 HF、DFT、MP2 和 CCSD 方法。作为 ORCA/Gaussian 的开源替代方案，用于分子量子化学计算。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: single-point-energy
  base_image_ref: psi4-1.10
  deprecated: true
  tags:
    software: psi4
    version: "1.10"
    method:
      - DFT
      - HF
      - MP2
      - CCSD
      - single-point
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - single-point-energy
    keywords:
      - psi4
      - single-point
      - energy
      - dft
      - open-source

  display_name_zh: Psi4 单点能
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: >
      Molecular geometry in standard XYZ format (Angstrom).
    description_zh: 标准 XYZ 格式（埃）的分子几何结构。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: total_energy
    display_name: Total Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total electronic energy at the given geometry.
    description_zh: 给定几何结构处的总电子能量。

    display_name_zh: 最终能量
  - name: wavefunction_data
    display_name: Wavefunction Data
    io_type:
      category: software_data_package
      ecosystem: psi4
      data_type: wavefunction
    description: Psi4 wavefunction data (JSON serialized).
    description_zh: Psi4 波函数数据（JSON 序列化）。

    display_name_zh: 波函数数据
onboard_inputs:
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: method
    display_name: Electronic Structure Method
    kind: string
    default: B3LYP
    description: "Psi4 method keyword, e.g. B3LYP, PBE0, HF, MP2, CCSD(T)"
    description_zh: Psi4 方法关键字，例如 B3LYP、PBE0、HF、MP2、CCSD(T)。

    display_name_zh: 方法
  - name: basis_set
    display_name: Basis Set
    kind: string
    default: cc-pVDZ
    description: "Basis set name, e.g. cc-pVDZ, cc-pVTZ, 6-31G*"
    description_zh: 基组名称，例如 cc-pVDZ、cc-pVTZ、6-31G*。

    display_name_zh: 基组
  - name: reference
    display_name: SCF Reference
    kind: enum
    default: rhf
    allowed_values:
      - rhf
      - uhf
      - rohf

    display_name_zh: SCF 参考
    description: 'SCF reference: RHF / UHF / ROHF.'
    description_zh: SCF 参考态：RHF / UHF / ROHF。
  - name: scf_type
    display_name: SCF Algorithm
    kind: enum
    default: pk
    allowed_values:
      - pk
      - direct
      - df

    display_name_zh: SCF 算法
    description: SCF iteration algorithm (e.g. DIIS).
    description_zh: SCF 迭代算法（如 DIIS）。
onboard_outputs:
  - name: scf_energy
    display_name: SCF Energy (Ha)
    kind: float
    unit: Ha
    description: Final SCF energy.
    description_zh: 最终 SCF 能量。

    display_name_zh: 最终能量 (Ha)
  - name: scf_iterations
    display_name: SCF Iterations
    kind: integer
    description: Number of SCF cycles to convergence.
    description_zh: 收敛所需的 SCF 迭代次数。

    display_name_zh: SCF 迭代次数
  - name: scf_converged
    display_name: SCF Converged
    kind: boolean
    description: Whether the SCF calculation converged successfully.
    description_zh: SCF 计算是否成功收敛。
    quality_gate: true
    gate_default: must_pass
    gate_description: "SCF must converge for the energy to be meaningful."

    display_name_zh: SCF 已收敛
    gate_description_zh: SCF 必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 4.0
  mem_overhead: 4.0
  estimated_walltime_hours: 0.5
  scratch_disk_gb: 10.0
  parallel_tasks: 4
  parametrize:
    - cpu_cores
    - parallel_tasks
    - mem_gb
    - estimated_walltime_hours

execution: {}

semantic_identity: >-
  Single-point electronic energy calculation using Psi4 open-source
  quantum chemistry software. Produces total energy.

distinguishing_ports:
  - total_energy

rag_summary: ""
