# ===========================================================================
# orca-single-point — ORCA Single-Point Energy Calculation
#
# 使用 ORCA 进行单点能量计算（最基础的 ORCA 计算类型）。
# 适用场景：快速验证几何结构的能量，或为后续分析提供参考点。
# ===========================================================================

metadata:
  name: orca-single-point
  version: 1.0.0
  display_name: ORCA Single-Point Energy
  description: >
    Performs a single-point electronic energy calculation using ORCA.
    Computes the total energy at a fixed molecular geometry without geometry
    optimization. Supports DFT (B3LYP, PBE0, etc.) and wavefunction methods
    (HF, MP2, CCSD). Requires an XYZ geometry as on-board input.
  description_zh: >
    使用 ORCA 进行单点电子能量计算。
    在固定的分子几何结构下计算总能量，不进行几何优化。
    支持 DFT（B3LYP、PBE0 等）与波函数方法（HF、MP2、CCSD）。
    需要 XYZ 几何作为机载输入。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: single-point-energy
  base_image_ref: orca-6.1
  deprecated: true
  tags:
    software: orca
    version: "6.1"
    method:
      - DFT
      - HF
      - MP2
      - single-point
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - single-point-energy
      - population-analysis
    keywords:
      - orca
      - single-point
      - energy
      - dft
      - hf

  display_name_zh: ORCA 单点能
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: >
      Molecular geometry in standard XYZ format (Angstrom).
      Typically from geometry-file-input or another geometry source.
    description_zh: >
      标准 XYZ 格式（埃）的分子几何结构。
      通常来自 geometry-file-input 或其他几何来源。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: gbw_file
    display_name: GBW Wavefunction File
    io_type:
      category: software_data_package
      ecosystem: orca
      data_type: gbw-file
    description: ORCA binary wavefunction file (GBW). Used as input for subsequent calculations.
    description_zh: ORCA 二进制波函数文件（GBW）。可用作后续计算的输入。

    display_name_zh: GBW 波函数文件
  - name: total_energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total electronic energy at the given geometry.
    description_zh: 给定几何结构下的电子总能量。

    display_name_zh: 最终能量
  - name: mulliken_report
    display_name: Mulliken Population Report
    io_type:
      category: report_object
      format: json
      content_schema: '{"charges": [float], "spin_populations": [float], "atom_labels": [str]}'
      description: Mulliken population analysis results.
    description: JSON report of Mulliken charges and spin populations.
    description_zh: Mulliken 电荷与自旋布居的 JSON 报告。

    display_name_zh: Mulliken 布居报告
onboard_inputs:
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: method
    display_name: Electronic Structure Method
    kind: string
    default: B3LYP
    description: "ORCA method keyword, e.g. B3LYP, PBE0, HF, MP2, CCSD"
    description_zh: "ORCA 方法关键词，如 B3LYP、PBE0、HF、MP2、CCSD"

    display_name_zh: 方法
  - name: basis_set
    display_name: Basis Set
    kind: string
    default: def2-SVP
    description: "Basis set name, e.g. def2-SVP, def2-TZVP, 6-31G*"
    description_zh: "基组名称，如 def2-SVP、def2-TZVP、6-31G*"

    display_name_zh: 基组
  - name: dispersion
    display_name: Dispersion Correction
    kind: enum
    default: "none"
    allowed_values:
      - "none"
      - D3
      - D3BJ
      - D4

    display_name_zh: 色散校正
    description: Dispersion correction scheme; 'none' disables it.
    description_zh: 色散校正方法（D3/D3BJ 等），none 表示关闭。
onboard_outputs:
  - name: scf_energy
    display_name: SCF Energy (Ha)
    kind: float
    unit: Ha
    description: Final SCF energy.
    description_zh: 最终 SCF 能量。

    display_name_zh: 最终能量 (Ha)
  - name: scf_iterations
    display_name: SCF Iterations
    kind: integer
    description: Number of SCF cycles to convergence.
    description_zh: 达到收敛所需的 SCF 迭代次数。

    display_name_zh: SCF 迭代次数
  - name: scf_converged
    display_name: SCF Converged
    kind: boolean
    description: Whether the SCF calculation converged successfully.
    description_zh: SCF 计算是否成功收敛。
    quality_gate: true
    gate_default: must_pass
    gate_description: "SCF must converge for the energy to be meaningful."

    display_name_zh: SCF 已收敛
    gate_description_zh: SCF 必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 8.0
  estimated_walltime_hours: 0.5
  scratch_disk_gb: 10.0
  parallel_tasks: 4
  parametrize:
    - cpu_cores
    - parallel_tasks
    - estimated_walltime_hours

execution: {}

semantic_identity: >-
  Single-point electronic energy calculation using ORCA quantum chemistry software.
  Produces a GBW wavefunction file, total energy, and Mulliken charges.

distinguishing_ports:
  - gbw_file
  - total_energy

rag_summary: ""
