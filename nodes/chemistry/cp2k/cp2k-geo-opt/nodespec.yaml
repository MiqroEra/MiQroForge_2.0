# ===========================================================================
# cp2k-geo-opt — CP2K Geometry Optimization (Fixed Cell)
#
# 使用 CP2K 进行几何结构优化（固定晶胞，优化原子位置）。
# ===========================================================================

metadata:
  name: cp2k-geo-opt
  version: 1.0.0
  display_name: CP2K Geometry Optimization
  description: >
    Geometry optimization of atomic positions at fixed cell using CP2K.
    Supports BFGS, CG, and LBFGS optimization algorithms.
    For cell+atom optimization, use cp2k-cell-opt.
  description_zh: >
    使用 CP2K 在固定晶胞下对原子位置进行几何优化。
    支持 BFGS、CG 与 LBFGS 优化算法。
    若需同时优化晶胞与原子，请使用 cp2k-cell-opt。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: geometry-optimization
  base_image_ref: cp2k-2025.2
  tags:
    software: cp2k
    version: "2025.2"
    method:
      - DFT
      - GPW
      - periodic
      - geometry-optimization
    domain:
      - periodic
      - solid-state
    capabilities:
      - geometry-optimization
      - periodic-dft
    keywords:
      - cp2k
      - optimization
      - periodic

  display_name_zh: CP2K 几何优化
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: >
      Atomic positions in XYZ format (Angstrom).
    description_zh: >
      XYZ 格式的原子坐标（单位为埃）。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: optimized_xyz
    display_name: Optimized Geometry
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    description: Optimized atomic positions in XYZ format.
    description_zh: "优化后的原子坐标（XYZ 格式）。"

    display_name_zh: 优化后几何
  - name: total_energy
    display_name: Final Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total energy at the optimized geometry.
    description_zh: "优化后几何结构对应的总能量。"

    display_name_zh: 最终能量
  - name: cell_parameters
    display_name: Cell Parameters
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    description: Cell vectors (unchanged from input).
    description_zh: "晶胞矢量（与输入一致，未改变）。"

    display_name_zh: 晶胞参数
onboard_inputs:
  - name: charge
    display_name: System Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: cell_abc
    display_name: Cell Parameters (a b c alpha beta gamma)
    kind: string
    default: "5.43 5.43 5.43 90 90 90"
    description: "Unit cell: a b c (Ang) alpha beta gamma (deg)."
    description_zh: "晶胞：a b c（单位为埃）与 alpha beta gamma（单位为度）。"

    display_name_zh: 初始晶胞参数 (a b c α β γ)
  - name: xc_functional
    display_name: Exchange-Correlation Functional
    kind: enum
    default: PBE
    allowed_values:
      - PBE
      - PBE0
      - B3LYP
      - LDA
      - BLYP
      - TPSS
      - SCAN
      - HSE06

    display_name_zh: 交换关联泛函
    description: Exchange-correlation functional for DFT.
    description_zh: DFT 交换关联泛函。
  - name: basis_set
    display_name: Basis Set
    kind: string
    default: DZVP-MOLOPT-SR-GTH

    display_name_zh: 基组
    description: Basis set name, e.g. def2-SVP or cc-pVTZ.
    description_zh: 基组名称，如 def2-SVP、cc-pVTZ。
  - name: cutoff
    display_name: Plane-Wave Cutoff (Ry)
    kind: integer
    default: 400
    min_value: 100
    max_value: 2000
    unit: Ry

    display_name_zh: 平面波截断 (Ry)
    description: Plane-wave cutoff energy for CP2K.
    description_zh: CP2K 平面波能量截断。
  - name: rel_cutoff
    display_name: Relative Cutoff (Ry)
    kind: integer
    default: 50
    min_value: 20
    max_value: 200

    display_name_zh: 相对截断 (Ry)
    description: Relative cutoff for CP2K.
    description_zh: CP2K 的相对截断。
  - name: max_scf
    display_name: Max SCF Cycles
    kind: integer
    default: 50
    min_value: 5
    max_value: 500

    display_name_zh: 最大 SCF 循环数
    description: Maximum number of SCF iterations.
    description_zh: SCF 迭代最大次数。
  - name: eps_scf
    display_name: SCF Convergence
    kind: float
    default: 1.0e-6

    display_name_zh: SCF 收敛阈值
    description: SCF energy convergence threshold.
    description_zh: SCF 能量收敛判据。
  - name: smearing
    display_name: Electronic Smearing
    kind: enum
    default: "fermi_dirac"
    allowed_values:
      - "none"
      - "fermi_dirac"

    display_name_zh: 电子 Smearing
    description: Occupation smearing scheme.
    description_zh: 占据函数的 Smearing 方式。
  - name: electronic_temperature
    display_name: Electronic Temperature (K)
    kind: integer
    default: 300
    min_value: 0
    max_value: 10000

    display_name_zh: 电子温度 (K)
    description: Electronic temperature for smearing.
    description_zh: Smearing 的电子温度。
  - name: opt_algorithm
    display_name: Optimization Algorithm
    kind: enum
    default: BFGS
    allowed_values:
      - BFGS
      - CG
      - LBFGS

    display_name_zh: 优化算法
    description: Geometry optimization algorithm (CG / BFGS).
    description_zh: 几何优化算法（CG / BFGS 等）。
  - name: max_opt_iter
    display_name: Max Optimization Steps
    kind: integer
    default: 200
    min_value: 10
    max_value: 2000

    display_name_zh: 最大优化步数
    description: Maximum geometry optimization iterations.
    description_zh: 几何优化最大迭代步数。
  - name: opt_max_force
    display_name: Force Convergence (Ha/bohr)
    kind: float
    default: 4.5e-4
    description: "Maximum force threshold for convergence."
    description_zh: "收敛判据：最大受力阈值。"

    display_name_zh: 力收敛 (Ha/bohr)
onboard_outputs:
  - name: final_energy
    display_name: Final Energy (Ha)
    kind: float
    unit: Ha

    display_name_zh: 最终能量 (Ha)
    description: Total energy of the optimized structure (Hartree).
    description_zh: 优化末态的总能量（Hartree）。
  - name: opt_cycles
    display_name: Optimization Cycles
    kind: integer

    display_name_zh: 优化循环数
    description: Number of geometry optimization cycles.
    description_zh: 几何优化循环次数。
  - name: opt_converged
    display_name: Optimization Converged
    kind: boolean
    quality_gate: true
    gate_default: must_pass
    gate_description: "Geometry optimization must converge."

    display_name_zh: 优化已收敛
    description: Whether geometry optimization converged.
    description_zh: 几何优化是否已收敛。
    gate_description_zh: 晶胞优化必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 16.0
  estimated_walltime_hours: 2.0
  scratch_disk_gb: 20.0
  parallel_tasks: 4
  parametrize:
    - cpu_cores
    - parallel_tasks
    - estimated_walltime_hours
    - scratch_disk_gb

execution: {}

semantic_identity: >-
  Geometry optimization of atomic positions at fixed cell using CP2K.
  For periodic systems (bulk, slabs).

distinguishing_ports:
  - optimized_xyz
  - total_energy

rag_summary: ""
