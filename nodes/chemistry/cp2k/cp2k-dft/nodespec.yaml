# cp2k-dft — CP2K DFT Single-Point (Periodic Systems)
metadata:
  name: cp2k-dft
  version: 1.0.0
  display_name: CP2K DFT Single-Point
  description: >
    DFT single-point energy calculation for periodic systems using CP2K
    (GPW/GAPW method). Supports PBC, plane-wave cutoff, and electronic
    smearing for metals.
  description_zh: >
    使用 CP2K 对周期性体系进行 DFT 单点能计算（GPW/GAPW 方法）。
    支持周期性边界条件（PBC）、平面波截断以及金属体系的电子展宽。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: crystal-single-point-energy
  base_image_ref: cp2k-2025.2
  tags:
    software: cp2k
    version: "2025.2"
    method:
      - DFT
      - single-point
    domain:
      - periodic
      - solid-state
    capabilities:
      - single-point-energy
      - periodic-dft
    keywords:
      - cp2k
      - dft
      - periodic

  display_name_zh: CP2K DFT 单点能
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: Atomic positions in XYZ format.
    description_zh: "XYZ 格式的原子坐标。"

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: total_energy
    display_name: Total Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total electronic energy.
    description_zh: "总电子能量。"

    display_name_zh: 最终能量
  - name: cell_parameters
    display_name: Cell Parameters
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    description: Cell vectors.
    description_zh: "晶胞矢量。"

    display_name_zh: 晶胞参数
onboard_inputs:
  - name: charge
    display_name: System Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: cell_abc
    display_name: Cell Parameters (a b c alpha beta gamma)
    kind: string
    default: "5.43 5.43 5.43 90 90 90"

    display_name_zh: 初始晶胞参数 (a b c α β γ)
    description: Initial cell parameters for periodic systems.
    description_zh: 周期性体系的初始晶胞参数（a b c α β γ）。
  - name: functional
    default: PBE
    _shared_param: functionals

  - name: basis_set
    default: DZVP-MOLOPT-SR-GTH
    _shared_param: basis_sets

  - name: cutoff
    display_name: Plane-Wave Cutoff (Ry)
    kind: integer
    default: 400
    min_value: 100
    max_value: 2000
    unit: Ry

    display_name_zh: 平面波截断 (Ry)
    description: Plane-wave cutoff energy for CP2K.
    description_zh: CP2K 平面波能量截断。
  - name: rel_cutoff
    display_name: Relative Cutoff (Ry)
    kind: integer
    default: 50
    min_value: 20
    max_value: 200

    display_name_zh: 相对截断 (Ry)
    description: Relative cutoff for CP2K.
    description_zh: CP2K 的相对截断。
  - name: max_scf
    display_name: Max SCF Cycles
    kind: integer
    default: 50
    min_value: 5
    max_value: 500

    display_name_zh: 最大 SCF 循环数
    description: Maximum number of SCF iterations.
    description_zh: SCF 迭代最大次数。
  - name: eps_scf
    display_name: SCF Convergence Threshold
    kind: float
    default: 1.0e-6

    display_name_zh: SCF 收敛阈值
    description: SCF energy convergence threshold.
    description_zh: SCF 能量收敛判据。
  - name: smearing
    display_name: Electronic Smearing
    kind: enum
    default: "fermi_dirac"
    allowed_values:
      - "none"
      - "fermi_dirac"

    display_name_zh: 电子 Smearing
    description: Occupation smearing scheme.
    description_zh: 占据函数的 Smearing 方式。
  - name: electronic_temperature
    display_name: Electronic Temperature (K)
    kind: integer
    default: 300
    min_value: 0
    max_value: 10000

    display_name_zh: 电子温度 (K)
    description: Electronic temperature for smearing.
    description_zh: Smearing 的电子温度。
onboard_outputs:
  - name: scf_energy
    display_name: Final Energy (Ha)
    kind: float
    unit: Ha

    display_name_zh: 最终能量 (Ha)
    description: Total energy after SCF convergence (Hartree).
    description_zh: SCF 收敛后的总能量（Hartree）。
  - name: scf_converged
    display_name: SCF Converged
    kind: boolean
    quality_gate: true
    gate_default: must_pass

    display_name_zh: SCF 已收敛
    description: Whether SCF converged.
    description_zh: SCF 是否已收敛。
    gate_description_zh: SCF 必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 16.0
  estimated_walltime_hours: 1.0
  scratch_disk_gb: 20.0
  parallel_tasks: 4
  parametrize:
    - cpu_cores
    - parallel_tasks
    - estimated_walltime_hours
    - scratch_disk_gb

execution: {}

semantic_identity: >-
  DFT single-point energy calculation for periodic systems using CP2K.

distinguishing_ports:
  - total_energy
  - cell_parameters

rag_summary: ""
