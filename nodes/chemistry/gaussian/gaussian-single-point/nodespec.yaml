# ===========================================================================
# gaussian-single-point — Gaussian 16 Single-Point Energy Calculation
#
# 使用 Gaussian 16 进行单点能量计算。
# ===========================================================================

metadata:
  name: gaussian-single-point
  version: 1.0.0
  display_name: Gaussian 16 Single-Point Energy
  description: >
    Performs a single-point electronic energy calculation using Gaussian 16.
    Supports DFT, HF, MP2, and CCSD methods. Produces a formatted checkpoint
    file (.fchk) and energy.
  description_zh: >
    使用 Gaussian 16 进行单点电子能量计算。
    支持 DFT、HF、MP2 与 CCSD 方法。
    输出格式化检查点文件（.fchk）与能量。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: single-point-energy
  base_image_ref: g16
  deprecated: true
  tags:
    software: gaussian
    version: "16"
    method:
      - DFT
      - HF
      - MP2
      - single-point
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - single-point-energy
    keywords:
      - gaussian
      - single-point
      - energy
      - dft

  display_name_zh: Gaussian 单点能
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: >
      Molecular geometry in standard XYZ format (Angstrom).
    description_zh: >
      标准 XYZ 格式（埃）的分子几何结构。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: fchk_file
    display_name: Formatted Checkpoint File
    io_type:
      category: software_data_package
      ecosystem: gaussian
      data_type: formatted-checkpoint
    description: Gaussian formatted checkpoint file (.fchk) containing wavefunction data.
    description_zh: Gaussian 格式化检查点文件（.fchk），包含波函数数据。

    display_name_zh: Formatted Checkpoint 文件
  - name: total_energy
    display_name: Total Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total electronic energy at the given geometry.
    description_zh: 给定几何结构下的总电子能量。

    display_name_zh: 最终能量
onboard_inputs:
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: method
    display_name: Method
    kind: string
    default: B3LYP
    description: "Gaussian method keyword: B3LYP, PBE0, HF, MP2, etc."
    description_zh: "Gaussian 方法关键字：B3LYP、PBE0、HF、MP2 等。"

    display_name_zh: 方法
  - name: basis_set
    display_name: Basis Set
    kind: string
    default: "6-31G*"
    description: "Basis set: 6-31G*, def2-SVP, cc-pVTZ, etc."
    description_zh: "基组：6-31G*、def2-SVP、cc-pVTZ 等。"

    display_name_zh: 基组
  - name: population
    display_name: Population Analysis
    kind: enum
    default: Full
    allowed_values:
      - Full
      - None
      - Minimal

    display_name_zh: 布居分析
    description: Population analysis type (Mulliken / NPA).
    description_zh: 电荷布居分析类型（Mulliken / NPA 等）。
onboard_outputs:
  - name: scf_energy
    display_name: SCF Energy (Ha)
    kind: float
    unit: Ha
    description: Final SCF energy.
    description_zh: 最终 SCF 能量。

    display_name_zh: 最终能量 (Ha)
  - name: scf_converged
    display_name: SCF Converged
    kind: boolean
    description: Whether the SCF calculation converged.
    description_zh: SCF 计算是否收敛。
    quality_gate: true
    gate_default: must_pass
    gate_description: "SCF must converge for the energy to be meaningful."

    display_name_zh: SCF 已收敛
    gate_description_zh: SCF 必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 8.0
  mem_overhead: 2.0
  estimated_walltime_hours: 0.5
  scratch_disk_gb: 10.0
  parametrize:
    - cpu_cores
    - mem_gb
    - estimated_walltime_hours

execution:
  environment:
    GAUSS_SCRDIR: "/tmp"

semantic_identity: >-
  Single-point electronic energy calculation using Gaussian 16.
  Produces formatted checkpoint file and total energy.

distinguishing_ports:
  - fchk_file
  - total_energy

rag_summary: ""
