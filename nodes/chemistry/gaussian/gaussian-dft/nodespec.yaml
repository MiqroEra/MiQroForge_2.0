# gaussian-dft — Gaussian 16 DFT Single-Point
metadata:
  name: gaussian-dft
  version: 1.0.0
  display_name: Gaussian DFT Single-Point
  description: >
    Density functional theory single-point energy calculation using Gaussian 16.
    Supports various exchange-correlation functionals and dispersion corrections.
  description_zh: >
    使用 Gaussian 16 进行密度泛函理论（DFT）单点能计算。
    支持多种交换关联泛函与色散校正。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: single-point-energy
  base_image_ref: g16
  tags:
    software: gaussian
    version: "16"
    method:
      - DFT
      - single-point
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - single-point-energy
    keywords:
      - gaussian
      - dft
      - functional

  display_name_zh: Gaussian DFT 单点能
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: Molecular geometry in standard XYZ format (Angstrom).
    description_zh: 标准 XYZ 格式（埃）的分子几何结构。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: fchk_file
    display_name: Formatted Checkpoint File
    io_type:
      category: software_data_package
      ecosystem: gaussian
      data_type: formatted-checkpoint
    description: Gaussian formatted checkpoint file (.fchk).
    description_zh: Gaussian 格式化检查点文件（.fchk）。

    display_name_zh: Formatted Checkpoint 文件
  - name: total_energy
    display_name: Total Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Total DFT electronic energy.
    description_zh: DFT 总电子能量。

    display_name_zh: 最终能量
onboard_inputs:
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: functional
    default: B3LYP
    _shared_param: functionals

  - name: basis_set
    default: "6-31G*"
    _shared_param: basis_sets

  - name: dispersion
    default: "none"
    _shared_param: dispersions

  - name: population
    display_name: Population Analysis
    kind: enum
    default: Full
    allowed_values:
      - Full
      - None
      - Minimal

    display_name_zh: 布居分析
    description: Population analysis type (Mulliken / NPA).
    description_zh: 电荷布居分析类型（Mulliken / NPA 等）。
onboard_outputs:
  - name: scf_energy
    display_name: SCF Energy (Ha)
    kind: float
    unit: Ha

    display_name_zh: 最终能量 (Ha)
    description: Total energy after SCF convergence (Hartree).
    description_zh: SCF 收敛后的总能量（Hartree）。
  - name: scf_converged
    display_name: SCF Converged
    kind: boolean
    quality_gate: true
    gate_default: must_pass
    gate_description: "SCF must converge."

    display_name_zh: SCF 已收敛
    description: Whether SCF converged.
    description_zh: SCF 是否已收敛。
    gate_description_zh: SCF 必须收敛。
resources:
  cpu_cores: 4
  mem_gb: 8.0
  mem_overhead: 2.0
  estimated_walltime_hours: 0.5
  scratch_disk_gb: 10.0
  parametrize:
    - cpu_cores
    - mem_gb
    - estimated_walltime_hours

execution:
  environment:
    GAUSS_SCRDIR: "/tmp"

semantic_identity: >-
  DFT single-point energy calculation using Gaussian 16.

distinguishing_ports:
  - fchk_file
  - total_energy

rag_summary: ""
