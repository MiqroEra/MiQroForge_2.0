# ===========================================================================
# gaussian-freq — Gaussian 16 Frequency Analysis
#
# 使用 Gaussian 16 进行振动频率分析和热化学量计算。
# ===========================================================================

metadata:
  name: gaussian-freq
  version: 1.0.0
  display_name: Gaussian 16 Frequency Analysis
  description: >
    Performs harmonic vibrational frequency analysis using Gaussian 16.
    Computes ZPE, enthalpy, Gibbs free energy, and checks for imaginary
    frequencies.
  description_zh: >
    使用 Gaussian 16 进行谐振振动频率分析。
    计算零点能（ZPE）、焓、吉布斯自由能，并检查是否存在虚频。
  node_type: compute
  category: chemistry
  author: MiQroForge Team
  semantic_type: frequency-analysis
  base_image_ref: g16
  tags:
    software: gaussian
    version: "16"
    method:
      - DFT
      - HF
      - frequency
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - frequency-analysis
      - thermochemistry
    keywords:
      - gaussian
      - frequency
      - vibration
      - thermochemistry

  display_name_zh: Gaussian 频率分析
stream_inputs:
  - name: xyz_geometry
    display_name: Input Geometry (XYZ)
    io_type:
      category: physical_quantity
      unit: Ang
      shape: array
    required: true
    description: >
      Molecular geometry in standard XYZ format (Angstrom).
      Should be a stationary point (optimized geometry).
    description_zh: >
      标准 XYZ 格式（埃）的分子几何结构。
      应为驻点（优化后的几何结构）。

    display_name_zh: 输入几何 (XYZ)
stream_outputs:
  - name: zpe
    display_name: Zero-Point Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Zero-point vibrational energy.
    description_zh: 零点振动能。

    display_name_zh: 零点能
  - name: gibbs_free_energy
    display_name: Gibbs Free Energy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Gibbs free energy at the specified temperature.
    description_zh: 指定温度下的吉布斯自由能。

    display_name_zh: Gibbs 自由能
  - name: enthalpy
    display_name: Enthalpy
    io_type:
      category: physical_quantity
      unit: Ha
    description: Enthalpy (electronic + ZPE + thermal).
    description_zh: 焓（电子能量 + 零点能 + 热修正）。

    display_name_zh: 焓
  - name: thermo_report
    display_name: Thermochemistry Report
    io_type:
      category: report_object
      format: json
    description: Complete thermochemistry results in JSON format.
    description_zh: JSON 格式的完整热化学结果。

    display_name_zh: 热化学报告
onboard_inputs:
  - name: charge
    display_name: Molecular Charge
    kind: integer
    default: 0

    display_name_zh: 体系电荷
    description: Total charge of the system.
    description_zh: 分子或晶胞的总电荷。
  - name: multiplicity
    display_name: Spin Multiplicity
    kind: integer
    default: 1
    min_value: 1

    display_name_zh: 自旋多重度
    description: Spin multiplicity (2S+1) of the system.
    description_zh: 体系的自旋多重度（2S+1）。
  - name: method
    display_name: Method
    kind: string
    default: B3LYP
    description: "Gaussian method keyword: B3LYP, PBE0, HF, MP2, etc."
    description_zh: "Gaussian 方法关键字：B3LYP、PBE0、HF、MP2 等。"

    display_name_zh: 方法
  - name: basis_set
    display_name: Basis Set
    kind: string
    default: "6-31G*"
    description: "Basis set: 6-31G*, def2-SVP, cc-pVTZ, etc."
    description_zh: "基组：6-31G*、def2-SVP、cc-pVTZ 等。"

    display_name_zh: 基组
  - name: population
    display_name: Population Analysis
    kind: enum
    default: Full
    allowed_values:
      - Full
      - None
      - Minimal

    display_name_zh: 布居分析
    description: Population analysis type (Mulliken / NPA).
    description_zh: 电荷布居分析类型（Mulliken / NPA 等）。
  - name: temperature
    display_name: Temperature (K)
    kind: float
    default: 298.15
    min_value: 0.0
    max_value: 5000.0
    unit: K

    display_name_zh: 温度 (K)
    description: Temperature for thermochemistry.
    description_zh: 热力学计算的温度。
  - name: pressure
    display_name: Pressure (atm)
    kind: float
    default: 1.0
    min_value: 0.0
    max_value: 1000.0
    unit: atm

    display_name_zh: 压力 (atm)
    description: Pressure for thermochemistry.
    description_zh: 热力学计算的压力。
onboard_outputs:
  - name: n_imaginary
    display_name: Number of Imaginary Frequencies
    kind: integer
    description: Count of imaginary frequencies.
    description_zh: 虚频数量。

    display_name_zh: 虚频数
  - name: is_true_minimum
    display_name: Is True Minimum
    kind: boolean
    description: True if no imaginary frequencies found.
    description_zh: 未发现虚频时为 true。
    quality_gate: true
    gate_default: must_pass
    gate_description: "Structure must be a true minimum (no imaginary frequencies)."

    display_name_zh: 是否真极小点
    gate_description_zh: 结构必须是真极小点（无虚频）。
resources:
  cpu_cores: 4
  mem_gb: 8.0
  mem_overhead: 2.0
  estimated_walltime_hours: 2.0
  scratch_disk_gb: 10.0
  parametrize:
    - cpu_cores
    - mem_gb
    - estimated_walltime_hours

execution:
  environment:
    GAUSS_SCRDIR: "/tmp"

semantic_identity: >-
  Harmonic vibrational frequency analysis using Gaussian 16.
  Produces ZPE, enthalpy, Gibbs free energy, and frequency data.

distinguishing_ports:
  - gibbs_free_energy
  - thermo_report

rag_summary: ""
