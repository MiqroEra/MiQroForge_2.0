# ===========================================================================
# test-thermo-extractor — TEST/MOCK node for pipeline testing
#
# This is a test node using busybox. NOT for production.
# Uses mock shell scripts that write predetermined values.
# ===========================================================================

metadata:
  name: test-thermo-extractor
  version: 1.0.0
  display_name: '[TEST] Thermochemistry Extractor'
  description: '[TEST/MOCK] Extracts and converts thermochemistry data from frequency analysis. Mock version for pipeline testing.'
  description_zh: '[TEST/MOCK] 从频率分析中提取并转换热化学数据。用于管线测试的模拟 版本。'
  node_type: compute
  category: utility
  tags:
    software: test
    version: '0.0'
    method:
      - extraction
      - unit-conversion
    domain:
      - molecular
      - thermochemistry
    capabilities:
      - data-extraction
      - unit-conversion
    keywords:
      - test
      - mock
      - thermo
      - gibbs
      - enthalpy
      - extraction
      - postprocessing
  author: MiQroForge Team
  semantic_type: frequency-analysis
  base_image_ref: test-busybox
  display_name_zh: '[TEST] 热化学提取器'
stream_inputs:
  - name: thermo_data_in
    display_name: Thermochemistry Data
    io_type:
      category: software_data_package
      ecosystem: gaussian
      data_type: thermo-data
      file_patterns:
        - thermo.json
    required: true
    description: Thermochemistry data from upstream frequency analysis.
    description_zh: 来自上游频率分析的热化学数据。
    display_name_zh: 热化学数据
stream_outputs:
  - name: gibbs_ev
    display_name: Gibbs Energy (eV)
    io_type:
      category: physical_quantity
      unit: eV
      shape: scalar
    description: Gibbs free energy converted to eV.
    description_zh: 转换为 eV 的 Gibbs 自由能量。
    display_name_zh: Gibbs 能量 (eV)
  - name: summary
    display_name: Summary Report
    io_type:
      category: report_object
      format: json
      content_schema: '{"gibbs_ev": "float", "enthalpy_ev": "float", "is_minimum": "bool"}'
      description: JSON summary of extracted thermochemistry data.
    description: Machine-readable summary of thermochemistry results.
    description_zh: 热化学结果的机器可读摘要。
    display_name_zh: 摘要报告
onboard_inputs:
  - name: energy_unit
    display_name: Energy Unit
    kind: enum
    default: Ha
    required: true
    allowed_values:
      - Ha
      - eV
      - kcal/mol
      - kJ/mol
    display_name_zh: 能量单位
    description: Output energy unit (Ha / eV / kcal/mol).
    description_zh: 输出能量的单位（Ha / eV / kcal/mol）。
onboard_outputs:
  - name: gibbs_converted
    display_name: Gibbs (converted)
    kind: float
    description: Gibbs energy in the requested unit.
    description_zh: 以请求单位表示的 Gibbs 能量。
    display_name_zh: Gibbs (换算后)
  - name: is_valid_minimum
    display_name: Valid Minimum
    kind: boolean
    description: Whether structure is a valid minimum for downstream use.
    description_zh: 结构是否为可供下游使用的有效极小点。
    display_name_zh: 有效极小点
resources:
  cpu_cores: 1
  mem_gb: 0.25
  estimated_walltime_hours: 0.005
  gpu_count: 0
execution:
  profile_mount_path: /mf/profile
  input_mount_path: /mf/input
  output_mount_path: /mf/output
  entrypoint_script: run.sh
semantic_identity: '[TEST] Post-processing extraction and unit conversion of thermochemistry results'
distinguishing_ports:
  - thermo_data_in
  - gibbs_ev
rag_summary: ''
